name: Temporary cloud STT formatter

on:
  push:
    branches:
      - security/move-cloud-stt-to-main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/move-cloud-stt-to-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Format cloud STT migration
        run: |
          npx prettier --write \
            .github/workflows/format-cloud-stt.yml \
            electron/ipc/handlers.ts \
            electron/preload.ts \
            electron/services/cloudTranscriptionService.ts \
            src/services/whisper.ts \
            src/types/index.ts \
            tests/credentialStore.test.ts \
            tests/electronCloudTranscription.test.ts \
            tests/whisperProviderRouting.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/format-cloud-stt.yml electron/ipc/handlers.ts electron/preload.ts electron/services/cloudTranscriptionService.ts src/services/whisper.ts src/types/index.ts tests/credentialStore.test.ts tests/electronCloudTranscription.test.ts tests/whisperProviderRouting.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format main-process cloud STT migration"
            git push origin HEAD:security/move-cloud-stt-to-main
          fi
