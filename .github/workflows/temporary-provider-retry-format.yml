name: Temporary provider retry formatter

on:
  push:
    branches:
      - reliability/provider-retry-contract

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reliability/provider-retry-contract
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/services/providers/requestLifecycle.ts src/services/providers/types.ts src/services/providers/LLMProvider.ts src/services/providers/STTProvider.ts tests/providers/providers.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/providers/requestLifecycle.ts src/services/providers/types.ts src/services/providers/LLMProvider.ts src/services/providers/STTProvider.ts tests/providers/providers.test.ts
          git commit -m "style(providers): format bounded retry implementation"
          git push origin HEAD:reliability/provider-retry-contract
