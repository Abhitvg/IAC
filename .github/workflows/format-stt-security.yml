name: Temporary STT security formatter

on:
  push:
    branches:
      - security/remove-stt-vite-secret-fallback

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/remove-stt-vite-secret-fallback
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Format STT security changes
        run: npx prettier --write .github/workflows/format-stt-security.yml docs/ENGINEERING_AUDIT_2026-11-10.md tests/credentialStore.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/format-stt-security.yml docs/ENGINEERING_AUDIT_2026-11-10.md tests/credentialStore.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format STT security follow-up"
            git push origin HEAD:security/remove-stt-vite-secret-fallback
          fi
