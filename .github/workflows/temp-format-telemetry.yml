name: Temporary telemetry formatter
on:
  push:
    branches:
      - reliability/aggregate-interview-telemetry
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability/aggregate-interview-telemetry
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write docs/reliability/interview-pipeline-audit.md src/services/diagnosticLogger.ts tests/requestCongestionAndDiagnostics.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reliability/interview-pipeline-audit.md src/services/diagnosticLogger.ts tests/requestCongestionAndDiagnostics.test.ts
          git commit -m "style(interview): format telemetry diagnostics"
          git push origin reliability/aggregate-interview-telemetry
