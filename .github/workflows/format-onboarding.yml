name: Temporary formatter

on:
  push:
    branches:
      - fix/onboarding-real-checks

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/onboarding-real-checks
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/OnboardingModal.tsx
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/OnboardingModal.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: format onboarding improvements"
            git push origin HEAD:fix/onboarding-real-checks
          fi
