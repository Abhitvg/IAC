name: Temporary formatter for current-main onboarding patch

on:
  push:
    branches:
      - fix/onboarding-truthful-setup-current-main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/onboarding-truthful-setup-current-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Format onboarding changes
        run: |
          npx prettier --write src/components/OnboardingModal.tsx src/services/onboarding/credentialSetup.ts src/services/onboarding/settingsSetup.ts tests/onboardingCredentialSetup.test.ts tests/onboardingSettingsSetup.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src/components/OnboardingModal.tsx src/services/onboarding/credentialSetup.ts src/services/onboarding/settingsSetup.ts tests/onboardingCredentialSetup.test.ts tests/onboardingSettingsSetup.test.ts
            git commit -m "style: format current-main onboarding changes"
            git push origin HEAD:fix/onboarding-truthful-setup-current-main
          fi
