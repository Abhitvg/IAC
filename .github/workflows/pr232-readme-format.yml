name: PR 232 README formatting

on:
  push:
    branches:
      - feat/careerops-aws-production-foundation
    paths:
      - .github/workflows/pr232-readme-format.yml
      - infra/aws/README.md

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/careerops-aws-production-foundation
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format README
        run: npx prettier --write infra/aws/README.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/aws/README.md
          if git diff --cached --quiet; then
            echo "README formatting is already clean."
            exit 0
          fi
          git commit -m "style: format AWS deployment README"
          git push origin HEAD:feat/careerops-aws-production-foundation
