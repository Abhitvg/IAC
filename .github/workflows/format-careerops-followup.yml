name: One-time CareerOps follow-up formatting

on:
  push:
    branches:
      - feat/careerops-aws-production-foundation
    paths:
      - .github/workflows/format-careerops-followup.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/careerops-aws-production-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/store/useAppStore.ts tests/engineAndLifecycle.test.ts
      - name: Commit formatting repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useAppStore.ts tests/engineAndLifecycle.test.ts
          git commit -m "style: format persistent wipe safeguards [skip ci]"
          git push origin feat/careerops-aws-production-foundation
