name: Format candidate document reset changes

on:
  push:
    branches:
      - fix/reset-resume-and-job-context

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/reset-resume-and-job-context
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier formatting
        run: npx prettier --write src/store/useAppStore.ts src/services/knowledgeVault/canonicalProfileService.ts tests/canonicalProfileAndWizard.test.ts
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useAppStore.ts src/services/knowledgeVault/canonicalProfileService.ts tests/canonicalProfileAndWizard.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format candidate document reset changes"
            git push
          else
            echo "Candidate reset files already formatted."
          fi
