name: Repair merged formatting

on:
  push:
    branches:
      - fix/post-merge-prettier-formatting

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/post-merge-prettier-formatting
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format files that failed CI
        run: |
          npx prettier --write \
            src/components/interview/LiveTranscript.tsx \
            src/services/AnswerGenerationService.ts \
            src/services/InterviewEngine.ts \
            src/services/ai.ts \
            src/services/interruptionDetector.ts \
            src/store/useAppStore.ts \
            tests/interruptionDetector.test.ts \
            tests/streamingReliability.test.ts

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/interview/LiveTranscript.tsx \
            src/services/AnswerGenerationService.ts \
            src/services/InterviewEngine.ts \
            src/services/ai.ts \
            src/services/interruptionDetector.ts \
            src/store/useAppStore.ts \
            tests/interruptionDetector.test.ts \
            tests/streamingReliability.test.ts
          git commit -m "style: apply Prettier to live interview reliability changes"
          git push origin HEAD:fix/post-merge-prettier-formatting
