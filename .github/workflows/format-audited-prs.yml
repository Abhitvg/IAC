name: Apply Prettier to audited PR files

on:
  push:
    branches:
      - fix/onboarding-real-checks
      - fix/candidate-profile-clear-failure

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format changed implementation and test files
        run: |
          npx prettier --write \
            src/components/OnboardingModal.tsx \
            src/components/CandidateProfileWizard.tsx \
            src/services/knowledgeVault/canonicalProfileService.ts \
            src/services/knowledgeVault/knowledgeVaultService.ts \
            src/store/useCandidateVaultStore.ts \
            tests/canonicalProfileAndWizard.test.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/OnboardingModal.tsx \
            src/components/CandidateProfileWizard.tsx \
            src/services/knowledgeVault/canonicalProfileService.ts \
            src/services/knowledgeVault/knowledgeVaultService.ts \
            src/store/useCandidateVaultStore.ts \
            tests/canonicalProfileAndWizard.test.ts
          if git diff --cached --quiet; then
            echo "All audited files already match Prettier."
          else
            git commit -m "style: apply Prettier to audited changes"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
