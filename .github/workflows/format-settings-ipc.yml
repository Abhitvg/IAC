name: Temporary settings IPC security formatter

on:
  push:
    branches:
      - security/sanitize-settings-ipc

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/sanitize-settings-ipc
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Format settings IPC security changes
        run: |
          npx prettier --write \
            .github/workflows/format-settings-ipc.yml \
            docs/ENGINEERING_AUDIT_2026-11-10.md \
            electron/services/security.ts \
            electron/ipc/handlers.ts \
            tests/electronSecurityAudit.test.ts \
            tests/ipcValidation.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/format-settings-ipc.yml docs/ENGINEERING_AUDIT_2026-11-10.md electron/services/security.ts electron/ipc/handlers.ts tests/electronSecurityAudit.test.ts tests/ipcValidation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format settings IPC security changes"
            git push origin HEAD:security/sanitize-settings-ipc
          fi
