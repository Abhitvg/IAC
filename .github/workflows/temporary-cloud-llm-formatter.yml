name: Temporary cloud LLM formatter
on:
  push:
    branches:
      - security/bound-cloud-llm-response-bodies-v2-20261111
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/bound-cloud-llm-response-bodies-v2-20261111
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write electron/services/cloudLLMStreaming.ts tests/cloudLLMStreaming.test.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/services/cloudLLMStreaming.ts tests/cloudLLMStreaming.test.ts
          git commit -m "style: format cloud LLM response bounds"
          git push
