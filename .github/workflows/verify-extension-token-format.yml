name: Temporary extension token format verification

on:
  push:
    branches:
      - style/fix-extension-token-prettier-current

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/fix-extension-token-prettier-current
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Format and verify extension token files
        run: |
          npx prettier --write electron/preload.ts src/components/SettingsPanel.tsx src/types/index.ts
          npx prettier --write src/types/index.ts
          git diff -- src/types/index.ts
          npx prettier --check electron/preload.ts src/components/SettingsPanel.tsx src/types/index.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/preload.ts src/components/SettingsPanel.tsx src/types/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format extension token IPC files"
            git push origin HEAD:style/fix-extension-token-prettier-current
          fi
