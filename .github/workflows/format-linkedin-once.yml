name: One-time LinkedIn Prettier
on:
  push:
    branches:
      - feat/linkedin-playbook-workbench
    paths:
      - .github/workflows/format-linkedin-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format the LinkedIn image-post changes
        run: >
          npx prettier --write
          apps/api/src/linkedin/client.ts
          apps/api/src/server.ts
          src/components/careerOps/LinkedInConnectionPanel.tsx
          tests/linkedin-api.test.ts
          tests/linkedin-cloud-api.test.ts
      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/api/src/linkedin/client.ts             apps/api/src/server.ts             src/components/careerOps/LinkedInConnectionPanel.tsx             tests/linkedin-api.test.ts             tests/linkedin-cloud-api.test.ts
          git commit -m "chore: apply Prettier to LinkedIn image posts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
