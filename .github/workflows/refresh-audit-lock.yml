name: Refresh security audit lockfile

on:
  push:
    branches: [security/audit-zod4-remove-unused-openai]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: security/audit-zod4-remove-unused-openai

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Regenerate the manifest lock and apply non-breaking security updates
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || echo "Some advisories require breaking dependency upgrades; preserving applicable safe lockfile updates."

      - name: Commit updated package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git add package-lock.json
          git commit -m "chore: apply non-breaking dependency audit fixes"
          git push origin HEAD:security/audit-zod4-remove-unused-openai
