name: Temporary Prettier repair for profile save flow

on:
  push:
    branches:
      - fix/profile-wizard-save-failure

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Format edited files
        run: npx prettier --write src/components/CandidateProfileWizard.tsx tests/canonicalProfileAndWizard.test.ts
      - name: Commit formatted output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CandidateProfileWizard.tsx tests/canonicalProfileAndWizard.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format candidate profile save changes"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
