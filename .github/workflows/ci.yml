name: CI

on:
  push:
    branches: [main, 'fix/**', 'feat/**', 'security/**']
  pull_request:

jobs:
  validate:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Report dependency security advisories
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          let report;
          try {
            report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          } catch (error) {
            console.error('Dependency audit report unavailable; refusing to pass an unverified audit.');
            process.exit(1);
          }
          if (!report.metadata?.vulnerabilities) {
            console.error('Dependency audit report is missing vulnerability metadata; refusing to pass.');
            process.exit(1);
          }
          const summary = report.metadata.vulnerabilities;
          console.log('Dependency audit summary:', JSON.stringify(summary));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: (item.via || []).map(v => typeof v === 'string' ? v : {
                title: v.title,
                url: v.url,
                range: v.range
              }),
              paths: item.nodes
            }));
          }
          if ((summary.high || 0) > 0 || (summary.critical || 0) > 0) {
            console.error('Dependency audit failed: high or critical vulnerabilities must be remediated.');
            process.exitCode = 1;
          }
          NODE

      - name: Print formatted DOCX archive tests (temporary)
        if: always()
        run: npx prettier tests/docxArchiveLimits.test.ts

      - name: Check formatting for changed files
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.md' '*.yml' '*.yaml' > /tmp/changed-files.txt
          else
            git diff --name-only --diff-filter=ACMR HEAD^ HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.md' '*.yml' '*.yaml' > /tmp/changed-files.txt
          fi
          if [[ -s /tmp/changed-files.txt ]]; then
            xargs -r npx prettier --check < /tmp/changed-files.txt
          else
            echo "No supported files changed; skipping formatting check."
          fi

      - name: Lint source files
        run: npm run lint

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm test

      - name: Build application bundle
        run: npm run build

      - name: Run Electron smoke and wizard accessibility tests
        if: matrix.os == 'ubuntu-24.04'
        run: xvfb-run -a npx playwright test e2e/app-launch.spec.ts e2e/wizard-accessibility.spec.ts e2e/responsive-shell.spec.ts

      - name: Build and launch packaged Linux application
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          npx electron-builder --dir --linux
          APP_EXECUTABLE="$PWD/release/linux-unpacked/ai-interview-assistant"
          test -x "$APP_EXECUTABLE"
          test -f release/linux-unpacked/resources/app.asar
          test -d release/linux-unpacked/resources/cmaps
          test -d release/linux-unpacked/resources/standard_fonts
          IAC_PACKAGED_EXECUTABLE="$APP_EXECUTABLE" xvfb-run -a npx playwright test e2e/packaged-app-smoke.spec.ts

      - name: Build and launch packaged macOS application
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          npx electron-builder --dir --mac
          APP_EXECUTABLE="$PWD/release/mac/AI-Interview-Assistant.app/Contents/MacOS/AI-Interview-Assistant"
          if [[ ! -x "$APP_EXECUTABLE" ]]; then
            APP_EXECUTABLE="$(find release -path '*/AI-Interview-Assistant.app/Contents/MacOS/AI-Interview-Assistant' -type f -print -quit)"
          fi
          test -x "$APP_EXECUTABLE"
          APP_RESOURCES="$(dirname "$(dirname "$APP_EXECUTABLE")")/Resources"
          test -f "$APP_RESOURCES/app.asar"
          IAC_PACKAGED_EXECUTABLE="$APP_EXECUTABLE" npx playwright test e2e/packaged-app-smoke.spec.ts

      - name: Build and launch packaged Windows application
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          npx electron-builder --dir --win
          $appExecutable = Join-Path $PWD 'release/win-unpacked/AI-Interview-Assistant.exe'
          if (-not (Test-Path $appExecutable)) {
            $appExecutable = (Get-ChildItem release -Filter 'AI-Interview-Assistant.exe' -Recurse | Select-Object -First 1).FullName
          }
          if (-not $appExecutable -or -not (Test-Path $appExecutable)) {
            throw 'Packaged Electron executable was not produced.'
          }
          $env:IAC_PACKAGED_EXECUTABLE = $appExecutable
          npx playwright test e2e/packaged-app-smoke.spec.ts

      - name: Verify zero secret leakage in build artifacts
        run: npm run security:check
