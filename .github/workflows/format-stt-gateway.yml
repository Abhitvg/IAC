name: Temporary STT gateway wiring formatter

on:
  push:
    branches:
      - security/wire-renderer-to-cloud-stt-gateway

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/wire-renderer-to-cloud-stt-gateway
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Format STT gateway wiring
        run: |
          npx prettier --write \
            .github/workflows/format-stt-gateway.yml \
            docs/ENGINEERING_AUDIT_2026-11-10.md \
            electron/ipc/handlers.ts \
            electron/preload.ts \
            electron/services/cloudTranscription.ts \
            src/services/whisper.ts \
            src/types/index.ts \
            tests/cloudTranscription.test.ts \
            tests/credentialStore.test.ts \
            tests/ipcValidation.test.ts \
            tests/whisperProviderRouting.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/format-stt-gateway.yml docs/ENGINEERING_AUDIT_2026-11-10.md electron/ipc/handlers.ts electron/preload.ts electron/services/cloudTranscription.ts src/services/whisper.ts src/types/index.ts tests/cloudTranscription.test.ts tests/credentialStore.test.ts tests/ipcValidation.test.ts tests/whisperProviderRouting.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format STT gateway wiring"
            git push origin HEAD:security/wire-renderer-to-cloud-stt-gateway
          fi
