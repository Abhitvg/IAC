name: Electron builder security migration check

on:
  push:
    branches:
      - security/electron-builder-26-18-1

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/electron-builder-26-18-1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - name: Upgrade to current v26 maintenance release
        run: npm install --save-dev electron-builder@26.18.1
      - name: Verify clean install, build, tests and unpacked Linux package
        run: |
          npm ci
          npm run build
          npm test
          npx electron-builder --linux dir --publish never
          npm audit --json > /tmp/audit.json || true
          node -e "const r=require('/tmp/audit.json'); console.log('Advisories after electron-builder update:', JSON.stringify(r.metadata?.vulnerabilities || {}));"
      - name: Commit manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were necessary."
          else
            git commit -m "security: update electron-builder to 26.18.1"
            git push
          fi
