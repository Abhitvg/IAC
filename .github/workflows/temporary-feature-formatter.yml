name: Temporary feature-branch formatter

on:
  push:
    branches:
      - fix/p0-live-interview-pipeline-reliability

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0-live-interview-pipeline-reliability
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format remediation files
        run: |
          npx prettier --write \
            src/components/interview/LiveTranscript.tsx \
            src/services/AnswerGenerationService.ts \
            src/services/InterviewEngine.ts \
            src/services/ai.ts \
            src/services/interruptionDetector.ts \
            src/store/useAppStore.ts \
            tests/interruptionDetector.test.ts \
            tests/streamingReliability.test.ts
      - name: Commit formatting changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/components/interview/LiveTranscript.tsx \
              src/services/AnswerGenerationService.ts \
              src/services/InterviewEngine.ts \
              src/services/ai.ts \
              src/services/interruptionDetector.ts \
              src/store/useAppStore.ts \
              tests/interruptionDetector.test.ts \
              tests/streamingReliability.test.ts
            git commit -m "style: format live interview reliability changes"
            git push origin HEAD:fix/p0-live-interview-pipeline-reliability
          else
            echo "No formatting changes required."
          fi
