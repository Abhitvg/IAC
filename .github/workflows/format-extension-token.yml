name: Temporary extension token formatter

on:
  push:
    branches:
      - security/extension-token-main-process-copy-current

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/extension-token-main-process-copy-current
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Format extension token changes
        run: npx prettier --write electron/preload.ts src/components/SettingsPanel.tsx src/types/index.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/preload.ts src/components/SettingsPanel.tsx src/types/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format extension token UI and preload"
            git push origin HEAD:security/extension-token-main-process-copy-current
          fi
