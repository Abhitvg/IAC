name: Temporary PDF layout test formatter

on:
  push:
    branches:
      - test/extract-pure-pdf-layout-service

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/extract-pure-pdf-layout-service
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Format PDF layout extraction files
        run: npx prettier --write tests/multiSourceIngestion.test.ts electron/services/pdfLayout.ts electron/services/pdfParser.ts
      - name: Verify formatting
        run: npx prettier --check tests/multiSourceIngestion.test.ts electron/services/pdfLayout.ts electron/services/pdfParser.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/multiSourceIngestion.test.ts electron/services/pdfLayout.ts electron/services/pdfParser.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format pure PDF layout extraction"
            git push origin HEAD:test/extract-pure-pdf-layout-service
          fi
