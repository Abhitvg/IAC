name: Temporary LinkedIn formatting

on:
  push:
    branches:
      - reliability/interview-pipeline-hardening

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: reliability/interview-pipeline-hardening
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format LinkedIn integration files
        run: npx prettier --write apps/api/src/server.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "All selected files are formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/server.ts
          git commit -m "style(linkedin): format LinkedIn API error handling"
          git push origin HEAD:reliability/interview-pipeline-hardening
