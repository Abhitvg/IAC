name: Temporary LinkedIn formatting

on:
  push:
    branches:
      - reliability/interview-pipeline-hardening

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: reliability/interview-pipeline-hardening
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format LinkedIn integration files
        run: |
          npx prettier --write \
            apps/api/src/linkedin/client.ts \
            apps/api/src/linkedin/oauth.ts \
            apps/api/src/linkedin/postgres-store.ts \
            apps/api/src/linkedin/create-integration.ts \
            apps/api/src/server.ts \
            apps/api/src/ports.ts \
            apps/api/src/runtime.ts \
            apps/api/src/postgres-repository.ts \
            tests/linkedin-api.test.ts \
            tsconfig.cloud.json \
            docs/linkedin-assist/CAPABILITIES.md \
            docs/linkedin-assist/README.md \
            docs/adr/0004-linkedin-assist-queue-only.md \
            docs/linkedin-assist/humanizer/slop.json \
            docs/linkedin-assist/profile-rubric.json
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "All selected files are formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/linkedin apps/api/src/server.ts apps/api/src/ports.ts apps/api/src/runtime.ts apps/api/src/postgres-repository.ts tests/linkedin-api.test.ts tsconfig.cloud.json docs
          git commit -m "style(linkedin): apply repository Prettier formatting"
          git push origin HEAD:reliability/interview-pipeline-hardening
