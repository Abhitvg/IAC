name: One-time PDF parser formatting
on:
  push:
    branches:
      - fix/prettier-pdf-parser
    paths:
      - '.github/workflows/format-pdf.yml'
      - 'electron/services/pdfParser.ts'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Format PDF parser and commit exact Prettier output
        run: |
          npx prettier --write electron/services/pdfParser.ts
          if ! git diff --quiet -- electron/services/pdfParser.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add electron/services/pdfParser.ts
            git commit -m "style: apply Prettier to PDF parser"
            git push
          fi
