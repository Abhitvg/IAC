name: Format LinkedIn poll capability

on:
  push:
    branches:
      - feat/linkedin-playbook-workbench
    paths:
      - 'apps/api/src/linkedin/client.ts'
      - 'apps/api/src/server.ts'
      - 'electron/ipc/handlers.ts'
      - 'src/components/careerOps/LinkedInConnectionPanel.tsx'
      - 'tests/linkedin-api.test.ts'
      - 'tests/linkedin-cloud-api.test.ts'
      - 'docs/linkedin-assist/CAPABILITIES.md'
      - 'docs/linkedin-assist/README.md'
      - 'docs/linkedin-assist/CONTENT_STUDIO.md'
      - 'docs/linkedin-assist/DEPLOYMENT.md'
      - '.github/workflows/format-linkedin-poll.yml'

permissions:
  contents: write

concurrency:
  group: linkedin-poll-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/linkedin-playbook-workbench
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format LinkedIn poll capability
        run: |
          npx prettier --write \
            apps/api/src/linkedin/client.ts \
            apps/api/src/server.ts \
            electron/ipc/handlers.ts \
            src/components/careerOps/LinkedInConnectionPanel.tsx \
            tests/linkedin-api.test.ts \
            tests/linkedin-cloud-api.test.ts \
            docs/linkedin-assist/CAPABILITIES.md \
            docs/linkedin-assist/README.md \
            docs/linkedin-assist/CONTENT_STUDIO.md \
            docs/linkedin-assist/DEPLOYMENT.md
      - name: Commit formatter output
        shell: bash
        run: |
          git add apps/api/src/linkedin/client.ts apps/api/src/server.ts electron/ipc/handlers.ts src/components/careerOps/LinkedInConnectionPanel.tsx tests/linkedin-api.test.ts tests/linkedin-cloud-api.test.ts docs/linkedin-assist/CAPABILITIES.md docs/linkedin-assist/README.md docs/linkedin-assist/CONTENT_STUDIO.md docs/linkedin-assist/DEPLOYMENT.md
          if git diff --cached --quiet; then
            echo "LinkedIn poll capability files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format LinkedIn poll capability"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
