name: Temporary interview formatter

on:
  push:
    branches:
      - reliability/interview-pipeline-hardening

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reliability/interview-pipeline-hardening
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/services/AnswerGenerationService.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/AnswerGenerationService.ts
          git commit -m "style(interview): format generation telemetry"
          git push origin HEAD:reliability/interview-pipeline-hardening
