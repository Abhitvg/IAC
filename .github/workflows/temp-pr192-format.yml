name: Temporary PR 192 formatter
on:
  push:
    branches:
      - fix/practice-topic-report-evidence-20261111
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/practice-topic-report-evidence-20261111
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/services/practice/InterviewReportGenerator.ts tests/interviewReportGenerator.test.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/services/practice/InterviewReportGenerator.ts tests/interviewReportGenerator.test.ts
            git commit -m "style(practice): format topic evidence report changes"
            git push origin HEAD:fix/practice-topic-report-evidence-20261111
          fi
