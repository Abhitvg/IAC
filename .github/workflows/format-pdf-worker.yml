name: Temporary formatter

on:
  push:
    branches:
      - fix/ci-stream-and-credential-tests

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-stream-and-credential-tests
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci
      - run: npx prettier --write electron/services/pdfParser.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/services/pdfParser.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: format cross-platform PDF worker fix"
            git push origin HEAD:fix/ci-stream-and-credential-tests
          fi
