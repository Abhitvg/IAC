name: Temporary dependency-branch Prettier repair

on:
  push:
    branches: [security/dependency-audit-priority-fixes]
    paths:
      - '.github/workflows/format-dependency-branch.yml'
      - 'electron/main.ts'
      - 'src/services/knowledgeVault/schemaValidation.ts'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Format affected security files
        run: npx prettier --write electron/main.ts src/services/knowledgeVault/schemaValidation.ts
      - name: Commit exact formatter output when needed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add electron/main.ts src/services/knowledgeVault/schemaValidation.ts
            git commit -m "style: format security remediation files"
            git push
          else
            echo "Targeted files already match Prettier."
          fi
