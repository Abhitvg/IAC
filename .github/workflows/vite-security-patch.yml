name: Vite security patch

on:
  push:
    branches:
      - security/vite-6-4-5

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/vite-6-4-5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - name: Update within the supported Vite 6 line
        run: npm install --save-dev vite@6.4.5
      - name: Verify clean dependency install, build and unit tests
        run: |
          npm ci
          npm run build
          npm test -- --run
          npm audit --json > /tmp/audit.json || true
          node -e "const r=require('/tmp/audit.json'); console.log('Dependency advisories after Vite patch:', JSON.stringify(r.metadata?.vulnerabilities || {}));"
      - name: Commit manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were necessary."
          else
            git commit -m "fix: update Vite to patched 6.4.5 release"
            git push
          fi
