name: Format settings persistence branch

on:
  push:
    branches:
      - fix/serialize-settings-persistence-20261110

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/serialize-settings-persistence-20261110

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Format changed source and tests
        run: npx prettier --write src/store/useAppStore.ts src/utils/settingWriteQueue.ts tests/settingWriteQueue.test.ts

      - name: Commit formatting changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useAppStore.ts src/utils/settingWriteQueue.ts tests/settingWriteQueue.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format settings persistence changes"
            git push origin HEAD:fix/serialize-settings-persistence-20261110
          else
            echo "Files already formatted."
          fi
