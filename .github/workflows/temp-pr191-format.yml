name: Temporary PR 191 formatter

on:
  workflow_dispatch:
  push:
    branches:
      - fix/practice-static-coding-scores-neutral-20261111

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write tests/interviewIntelligenceIntegration.test.ts tests/interviewReportGenerator.test.ts tests/runtimeSmokeTest.test.ts
      - name: Commit formatting changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/interviewIntelligenceIntegration.test.ts tests/interviewReportGenerator.test.ts tests/runtimeSmokeTest.test.ts
            git commit -m "style(practice): format updated coding evaluation tests"
            git push
          fi
