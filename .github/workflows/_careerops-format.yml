name: Temporary CareerOps formatter

on:
  push:
    branches:
      - feat/careerops-transactional-migrations

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'Abhitvg'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/careerops-transactional-migrations
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format the exact failing files
        run: npx prettier --write apps/api/src/migrations.ts packages/cloud-core/src/auth.ts tsconfig.cloud.json
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/migrations.ts packages/cloud-core/src/auth.ts tsconfig.cloud.json
          if ! git diff --cached --quiet; then
            git commit -m "style(careerops): apply Prettier to cloud migration and auth code"
            git push origin HEAD:feat/careerops-transactional-migrations
          fi
