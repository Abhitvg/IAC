name: Temporary practice caller formatter

on:
  push:
    branches:
      - fix/mock-gym-secure-llm-caller-20261111

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[prettier-bot]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mock-gym-secure-llm-caller-20261111
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/services/practice/createPracticeLLMCaller.ts
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/practice/createPracticeLLMCaller.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style(practice): apply pinned Prettier [prettier-bot]"
            git push
          fi
