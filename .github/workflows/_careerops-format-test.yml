name: Temporary CareerOps test formatter

on:
  push:
    branches:
      - feat/careerops-m0-cloud-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write tests/cloud-foundation.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/cloud-foundation.test.ts
          git commit -m "style(careerops): format tenant selection tests"
          git push origin "HEAD:${GITHUB_REF_NAME}"
