name: Temporary formatting diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print Prettier patch
        run: |
          npx prettier --write electron/main.ts src/components/teleprompter/TeleprompterView.tsx
          git diff --unified=2 -- electron/main.ts src/components/teleprompter/TeleprompterView.tsx
