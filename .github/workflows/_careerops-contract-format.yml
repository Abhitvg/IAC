name: Temporary CareerOps contract formatter

on:
  push:
    branches:
      - feat/careerops-sprint-contract-lifecycle

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/careerops-sprint-contract-lifecycle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write packages/cloud-core/src/contract.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/cloud-core/src/contract.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(careerops): format consent canonicalization"
            git push origin HEAD:feat/careerops-sprint-contract-lifecycle
          fi
