name: Temporary format PDF limits

on:
  push:
    branches:
      - fix/limit-pdf-page-count-20261110

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/limit-pdf-page-count-20261110
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write electron/services/documentImportLimits.ts tests/documentImportLimits.test.ts electron/services/pdfParser.ts tests/pdfParser.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet -- electron/services/documentImportLimits.ts tests/documentImportLimits.test.ts electron/services/pdfParser.ts tests/pdfParser.test.ts; then
            echo "Files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/services/documentImportLimits.ts tests/documentImportLimits.test.ts electron/services/pdfParser.ts tests/pdfParser.test.ts
          git commit -m "style: apply Prettier to PDF page-limit changes"
          git pull --rebase origin fix/limit-pdf-page-count-20261110
          git push origin HEAD:fix/limit-pdf-page-count-20261110
