name: Temporary cloud generation formatter

on:
  push:
    branches:
      - security/move-cloud-generation-credentials-to-main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/move-cloud-generation-credentials-to-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Format cloud generation changes
        run: |
          npx prettier --write electron/ipc/handlers.ts electron/preload.ts src/types/index.ts src/services/ai.ts src/services/AnswerGenerationService.ts tests/electronSecurityAudit.test.ts tests/answerGenerationGroqFailover.test.ts
          npx prettier --check electron/ipc/handlers.ts electron/preload.ts src/types/index.ts src/services/ai.ts src/services/AnswerGenerationService.ts tests/electronSecurityAudit.test.ts tests/answerGenerationGroqFailover.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/ipc/handlers.ts electron/preload.ts src/types/index.ts src/services/ai.ts src/services/AnswerGenerationService.ts tests/electronSecurityAudit.test.ts tests/answerGenerationGroqFailover.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format main-process cloud generation migration"
            git push origin HEAD:security/move-cloud-generation-credentials-to-main
          fi
