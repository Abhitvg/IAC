name: One-time CareerOps formatting repair

on:
  push:
    branches:
      - feat/careerops-aws-production-foundation
    paths:
      - .github/workflows/format-careerops-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/careerops-aws-production-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only files reported by CI
        run: |
          npx prettier --write \
            docs/security/data-at-rest-inventory.md \
            electron/preload.ts \
            electron/services/encryptedRecordStore.ts \
            src/services/session.ts \
            src/store/useAppStore.ts \
            tests/encryptedRecordStore.test.ts \
            tests/engineAndLifecycle.test.ts
      - name: Commit formatting repair
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/security/data-at-rest-inventory.md electron/preload.ts electron/services/encryptedRecordStore.ts src/services/session.ts src/store/useAppStore.ts tests/encryptedRecordStore.test.ts tests/engineAndLifecycle.test.ts
          git commit -m "style: apply Prettier to CareerOps security changes [skip ci]"
          git push origin feat/careerops-aws-production-foundation
