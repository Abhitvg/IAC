name: Temporary OpenRouter preflight formatter

on:
  push:
    branches:
      - fix/openrouter-preflight-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/openrouter-preflight-format
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Format model registry
        run: npx prettier --write .github/workflows/format-openrouter-preflight.yml src/services/models/modelRegistry.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/format-openrouter-preflight.yml src/services/models/modelRegistry.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format model registry preflight code"
            git push origin HEAD:fix/openrouter-preflight-format
          fi
