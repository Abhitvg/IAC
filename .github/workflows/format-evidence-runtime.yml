name: Format evidence runtime test

on:
  push:
    branches:
      - security/remove-eval-evidence-loader

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/remove-eval-evidence-loader
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier formatting
        run: npx prettier --write tests/evidenceNodeRuntime.test.ts
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/evidenceNodeRuntime.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format evidence runtime regression test"
            git push
          else
            echo "Evidence runtime test already formatted."
          fi
