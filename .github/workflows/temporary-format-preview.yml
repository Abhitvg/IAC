name: Temporary formatter preview

on:
  push:
    branches:
      - fix/bound-evidence-document-payloads-20261110-v2

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Print Prettier formatting diff
        run: |
          npx prettier --write tests/evidenceRepositoryInspectionLimits.test.ts
          git --no-pager diff -- tests/evidenceRepositoryInspectionLimits.test.ts
