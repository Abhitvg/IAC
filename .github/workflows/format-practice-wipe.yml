name: Temporary Prettier repair for practice wipe

on:
  push:
    branches: [fix/practice-wipe-failure-reporting]
    paths:
      - '.github/workflows/format-practice-wipe.yml'
      - '.github/workflows/format-practice-wipe.yml'
      - 'src/components/SettingsPanel.tsx'
      - 'src/store/useAppStore.ts'
      - 'src/store/usePracticeStore.ts'
      - 'tests/practice/privacyHardening.test.ts'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier configuration
        run: npx prettier --write src/components/SettingsPanel.tsx src/store/useAppStore.ts src/store/usePracticeStore.ts tests/practice/privacyHardening.test.ts
      - name: Commit formatter output when needed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/SettingsPanel.tsx src/store/useAppStore.ts src/store/usePracticeStore.ts tests/practice/privacyHardening.test.ts
            git commit -m "style: format practice data wipe changes"
            git push
          else
            echo "Targeted files already match Prettier."
          fi
