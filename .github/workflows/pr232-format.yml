name: PR 232 formatting

on:
  push:
    branches:
      - feat/careerops-aws-production-foundation
    paths:
      - .github/workflows/pr232-format.yml
      - apps/api/src/config.ts
      - apps/api/src/main.ts
      - infra/aws/README.md
      - packages/cloud-core/src/master-key-provider.ts
      - tests/cloud-foundation.test.ts

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/careerops-aws-production-foundation
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format changed files
        run: |
          npx prettier --write \
            apps/api/src/config.ts \
            apps/api/src/main.ts \
            infra/aws/README.md \
            packages/cloud-core/src/master-key-provider.ts \
            tests/cloud-foundation.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/config.ts \
            apps/api/src/main.ts \
            infra/aws/README.md \
            packages/cloud-core/src/master-key-provider.ts \
            tests/cloud-foundation.test.ts
          if git diff --cached --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git commit -m "style: format envelope key provider integration"
          git push origin HEAD:feat/careerops-aws-production-foundation
