name: Temporary formatter preview

on:
  push:
    branches:
      - ui/live-interview-minimal-chat-hud

jobs:
  formatter-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Print exact Prettier changes
        shell: bash
        run: |
          for file in \
            src/components/teleprompter/TeleprompterView.tsx \
            src/services/teleprompter/interviewShortcuts.ts \
            tests/interviewShortcuts.test.ts; do
            echo "::group::Prettier diff: $file"
            npx prettier "$file" | diff -u "$file" - || true
            echo "::endgroup::"
          done
