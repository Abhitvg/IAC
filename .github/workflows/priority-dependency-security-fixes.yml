name: Priority dependency security fixes

on:
  push:
    branches:
      - security/dependency-audit-priority-fixes

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-audit-priority-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - name: Remove unused concurrently and patch Vite within major version
        run: |
          npm uninstall --save-dev concurrently
          npm install --save-dev vite@6.4.5
      - name: Clean install, build, tests, and audit report
        run: |
          npm ci
          npm run build
          npm test
          npm audit --json > /tmp/audit.json || true
          node -e "const r=require('/tmp/audit.json'); console.log('Dependency advisories after priority fixes:', JSON.stringify(r.metadata?.vulnerabilities || {}));"
      - name: Commit manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were necessary."
          else
            git commit -m "security: remove unused package and patch Vite"
            git push
          fi
