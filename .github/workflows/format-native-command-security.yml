name: Format native command security changes

on:
  push:
    branches:
      - security/native-command-argument-boundaries

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/native-command-argument-boundaries
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier formatting
        run: npx prettier --write electron/main.ts electron/services/nativeCommandRunner.ts tests/nativeCommandRunner.test.ts
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/main.ts electron/services/nativeCommandRunner.ts tests/nativeCommandRunner.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format native command security changes"
            git push
          else
            echo "Native command files already formatted."
          fi
