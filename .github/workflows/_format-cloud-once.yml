name: Temporary cloud formatting helper

on:
  push:
    branches:
      - feat/careerops-m0-cloud-foundation

permissions:
  contents: write

jobs:
  format-cloud:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format M0 files
        run: |
          npx prettier --write \
            apps/api/src/config.ts \
            apps/api/src/ports.ts \
            apps/api/src/postgres-repository.ts \
            apps/api/src/server.ts \
            docs/m0-demo.md \
            packages/cloud-core/src/audit.ts \
            packages/cloud-core/src/auth.ts \
            packages/cloud-core/src/contract.ts \
            packages/cloud-core/src/controls.ts \
            packages/cloud-core/src/encryption.ts \
            packages/cloud-core/src/tenant.ts \
            scripts/verify-source-secrets.js \
            tests/cloud-foundation.test.ts \
            tsconfig.cloud.json \
            package.json \
            .github/workflows/ci.yml
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api docs/m0-demo.md packages/cloud-core scripts/verify-source-secrets.js tests/cloud-foundation.test.ts tsconfig.cloud.json package.json .github/workflows/ci.yml
          git commit -m "style(careerops): format M0 cloud foundation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
