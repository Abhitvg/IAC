name: Temporary candidate import-cycle formatting repair

on:
  push:
    branches:
      - fix/remove-candidate-reset-import-cycle

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-candidate-reset-import-cycle
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier to candidate reset changes
        run: npx prettier --write src/services/knowledgeVault/canonicalProfileService.ts src/components/CandidateProfileWizard.tsx tests/canonicalProfileAndWizard.test.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/knowledgeVault/canonicalProfileService.ts src/components/CandidateProfileWizard.tsx tests/canonicalProfileAndWizard.test.ts
          if git diff --cached --quiet; then
            echo "Target files already match Prettier."
          else
            git commit -m "style: format candidate reset import-cycle fix"
            git push origin HEAD:fix/remove-candidate-reset-import-cycle
          fi
