name: Temporary settings credential formatting repair

on:
  push:
    branches:
      - chore/format-settings-credential-ipc

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/format-settings-credential-ipc
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier to credential settings changes
        run: npx prettier --write src/components/SettingsPanel.tsx src/services/onboarding/credentialSetup.ts tests/onboardingCredentialSetup.test.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SettingsPanel.tsx src/services/onboarding/credentialSetup.ts tests/onboardingCredentialSetup.test.ts
          if git diff --cached --quiet; then
            echo "Target files already match Prettier."
          else
            git commit -m "style: format credential settings persistence"
            git push origin HEAD:chore/format-settings-credential-ipc
          fi
