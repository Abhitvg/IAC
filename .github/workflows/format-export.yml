name: Temporary formatting export

on:
  push:
    branches:
      - feat/careerops-aws-production-foundation

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format files
        run: npx prettier --write electron/services/encryptedRecordStore.ts tests/encryptedRecordStore.test.ts
      - name: Stage formatted files
        run: |
          mkdir -p /tmp/formatted
          cp electron/services/encryptedRecordStore.ts tests/encryptedRecordStore.test.ts /tmp/formatted/
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-encrypted-store
          path: /tmp/formatted/
          retention-days: 1
