name: Temporary CareerOps rate limiter formatter

on:
  push:
    branches:
      - feat/careerops-postgres-rate-limiter

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/careerops-postgres-rate-limiter
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write apps/api/src/config.ts apps/api/src/ports.ts apps/api/src/server.ts apps/api/src/postgres-repository.ts apps/api/src/postgres-rate-limiter.ts apps/api/src/runtime.ts tests/cloud-foundation.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/config.ts apps/api/src/ports.ts apps/api/src/server.ts apps/api/src/postgres-repository.ts apps/api/src/postgres-rate-limiter.ts apps/api/src/runtime.ts tests/cloud-foundation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(careerops): format shared rate limiter runtime"
            git push origin HEAD:feat/careerops-postgres-rate-limiter
          fi
