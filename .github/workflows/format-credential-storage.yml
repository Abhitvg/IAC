name: Temporary credential storage formatting repair

on:
  push:
    branches:
      - security/fail-closed-credential-storage

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/fail-closed-credential-storage
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier to credential storage service
        run: npx prettier --write electron/services/credentialStore.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/services/credentialStore.ts
          if git diff --cached --quiet; then
            echo "Credential store already matches Prettier."
          else
            git commit -m "style: format secure credential storage"
            git push origin HEAD:security/fail-closed-credential-storage
          fi
