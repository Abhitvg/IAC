name: Temporary CareerOps PostgreSQL dependency setup

on:
  push:
    branches:
      - feat/careerops-postgres-runtime

permissions:
  contents: write

jobs:
  install:
    if: github.actor == 'Abhitvg'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/careerops-postgres-runtime
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL driver and types
        run: |
          npm install pg@^8.16.3 --save --no-audit --no-fund
          npm install @types/pg@^8.15.5 --save-dev --no-audit --no-fund
      - name: Format runtime changes
        run: npx prettier --write apps/api/src/config.ts apps/api/src/main.ts apps/api/src/postgres-pool.ts scripts/run-cloud-migrations.ts tests/postgres-pool.test.ts tsconfig.api.build.json tsconfig.cloud.json package.json
      - name: Commit dependency lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/api/src/config.ts apps/api/src/main.ts apps/api/src/postgres-pool.ts scripts/run-cloud-migrations.ts tests/postgres-pool.test.ts tsconfig.api.build.json tsconfig.cloud.json
          if ! git diff --cached --quiet; then
            git commit -m "build(careerops): add PostgreSQL driver and format runtime"
            git push origin HEAD:feat/careerops-postgres-runtime
          fi
