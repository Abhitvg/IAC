name: Temporary post-security formatting repair

on:
  push:
    branches:
      - chore/format-post-security-merges

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/format-post-security-merges
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier to merged security files
        run: npx prettier --write electron/services/credentialStore.ts src/components/OnboardingModal.tsx
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/services/credentialStore.ts src/components/OnboardingModal.tsx
          if git diff --cached --quiet; then
            echo "Target files already match Prettier."
          else
            git commit -m "style: format post-security merge changes"
            git push origin HEAD:chore/format-post-security-merges
          fi
