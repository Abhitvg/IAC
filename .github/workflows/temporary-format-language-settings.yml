name: Temporary format preferred language settings

on:
  push:
    branches:
      - fix/normalize-preferred-language-settings-20261110

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/normalize-preferred-language-settings-20261110
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/store/useAppStore.ts
      - name: Commit formatted file
        run: |
          if git diff --quiet -- src/store/useAppStore.ts; then
            echo "File already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useAppStore.ts
          git commit -m "style: apply Prettier to language settings store"
          git pull --rebase origin fix/normalize-preferred-language-settings-20261110
          git push origin HEAD:fix/normalize-preferred-language-settings-20261110
