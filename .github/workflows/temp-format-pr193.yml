name: Temporary PR 193 formatter
on:
  push:
    branches:
      - fix/practice-behavioral-report-evidence-20261111
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/practice-behavioral-report-evidence-20261111
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - run: npm ci --ignore-scripts
      - run: npx prettier --write tests/interviewReportGenerator.test.ts src/services/practice/InterviewReportGenerator.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/interviewReportGenerator.test.ts src/services/practice/InterviewReportGenerator.ts
            git commit -m "style: format behavioral report evidence changes"
            git push origin HEAD:fix/practice-behavioral-report-evidence-20261111
          fi
