name: Temporary capture telemetry formatter

on:
  push:
    branches:
      - reliability/capture-session-telemetry

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reliability/capture-session-telemetry
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/services/audio.ts src/services/session.ts src/services/diagnosticLogger.ts tests/sessionPersistence.test.ts tests/audioCaptureDiagnostics.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/audio.ts src/services/session.ts src/services/diagnosticLogger.ts tests/sessionPersistence.test.ts tests/audioCaptureDiagnostics.test.ts
          git commit -m "style(interview): format capture and session telemetry"
          git push origin HEAD:reliability/capture-session-telemetry
