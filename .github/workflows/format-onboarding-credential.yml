name: Temporary Prettier repair for onboarding credential flow

on:
  push:
    branches:
      - fix/onboarding-credential-failure-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/OnboardingModal.tsx src/services/onboarding/credentialSetup.ts tests/onboardingCredentialSetup.test.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/OnboardingModal.tsx src/services/onboarding/credentialSetup.ts tests/onboardingCredentialSetup.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format onboarding credential changes"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
