name: Temporary extension token security formatter

on:
  push:
    branches:
      - security/close-extension-token-startup-leak

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/close-extension-token-startup-leak
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Format and verify extension token security
        run: |
          npx prettier --write electron/services/security.ts electron/ipc/handlers.ts tests/electronSecurityAudit.test.ts
          npx prettier --check electron/services/security.ts electron/ipc/handlers.ts tests/electronSecurityAudit.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/services/security.ts electron/ipc/handlers.ts tests/electronSecurityAudit.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format extension token startup fix"
            git push origin HEAD:security/close-extension-token-startup-leak
          fi
