name: Temporary interview formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format interview changes
        run: |
          npx prettier --write \
            src/components/teleprompter/TeleprompterView.tsx \
            src/services/InterviewEngine.ts \
            src/services/interruptionDetector.ts \
            tests/transcriptClassificationRecovery.test.ts \
            tests/unclassifiedTranscriptConfirmation.test.ts
      - name: Commit formatter output to the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/teleprompter/TeleprompterView.tsx \
            src/services/InterviewEngine.ts \
            src/services/interruptionDetector.ts \
            tests/transcriptClassificationRecovery.test.ts \
            tests/unclassifiedTranscriptConfirmation.test.ts
          if git diff --cached --quiet; then
            echo "Prettier found no changes."
            exit 0
          fi
          git commit -m "style(interview): apply Prettier formatting"
          git push origin "HEAD:${BRANCH_NAME}"
