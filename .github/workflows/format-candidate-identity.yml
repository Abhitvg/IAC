name: Temporary Prettier repair for candidate identity

on:
  push:
    branches: [fix/no-fabricated-default-candidate-name]
    paths:
      - '.github/workflows/format-candidate-identity.yml'
      - '.github/workflows/format-candidate-identity.yml'
      - 'src/services/candidateIntelligence.ts'
      - 'tests/candidateFactualGroundingRegression.test.ts'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier configuration
        run: npx prettier --write src/services/candidateIntelligence.ts tests/candidateFactualGroundingRegression.test.ts
      - name: Commit formatter output when needed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/services/candidateIntelligence.ts tests/candidateFactualGroundingRegression.test.ts
            git commit -m "style: format candidate identity regression fix"
            git push
          else
            echo "Targeted files already match Prettier."
          fi
