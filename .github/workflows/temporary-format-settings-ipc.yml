name: Temporary format settings IPC validation

on:
  push:
    branches:
      - fix/settings-ipc-final-20261110

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out settings validation branch
        uses: actions/checkout@v7
        with:
          ref: fix/settings-ipc-final-20261110
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Format changed files
        run: npx prettier --write electron/ipc/handlers.ts tests/ipcValidation.test.ts
      - name: Commit formatting
        env:
          BRANCH: fix/settings-ipc-final-20261110
        run: |
          if git diff --quiet -- electron/ipc/handlers.ts tests/ipcValidation.test.ts; then
            echo "Formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/ipc/handlers.ts tests/ipcValidation.test.ts
          git commit -m "style: apply Prettier to settings IPC validation"
          git push origin "HEAD:${BRANCH}"
