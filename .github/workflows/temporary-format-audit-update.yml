name: Temporary format repair for refreshed engineering audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - docs/finalize-audit-formatting-20261110

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 160
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format engineering audit
        run: npx prettier --write docs/ENGINEERING_AUDIT_2026-11-10.md

      - name: Commit formatted audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "Audit is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ENGINEERING_AUDIT_2026-11-10.md
          git commit -m "style: format refreshed engineering audit"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${BRANCH}"
