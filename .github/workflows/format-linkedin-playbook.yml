name: Format LinkedIn Playbook feature branch

on:
  push:
    branches:
      - feat/linkedin-playbook-workbench
    paths:
      - 'src/components/careerOps/LinkedInContentStudio.tsx'
      - 'src/components/careerOps/LinkedInPlaybookWorkbench.tsx'
      - 'src/services/careerOps/linkedinContentQuality.ts'
      - 'tests/linkedin-content-quality.test.ts'
      - 'docs/linkedin-assist/CONTENT_STUDIO.md'
      - 'docs/linkedin-assist/README.md'

permissions:
  contents: write

concurrency:
  group: linkedin-playbook-formatter
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/linkedin-playbook-workbench
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format LinkedIn Playbook files
        run: |
          npx prettier --write \
            src/components/careerOps/LinkedInContentStudio.tsx \
            src/components/careerOps/LinkedInPlaybookWorkbench.tsx \
            src/services/careerOps/linkedinContentQuality.ts \
            tests/linkedin-content-quality.test.ts \
            docs/linkedin-assist/CONTENT_STUDIO.md \
            docs/linkedin-assist/README.md
      - name: Commit formatted files
        shell: bash
        run: |
          git add src/components/careerOps/LinkedInContentStudio.tsx src/components/careerOps/LinkedInPlaybookWorkbench.tsx src/services/careerOps/linkedinContentQuality.ts tests/linkedin-content-quality.test.ts docs/linkedin-assist/CONTENT_STUDIO.md docs/linkedin-assist/README.md
          if git diff --cached --quiet; then
            echo "Files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format LinkedIn Playbook workbench"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
