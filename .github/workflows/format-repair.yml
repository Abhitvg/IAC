name: One-off Prettier repair

on:
  push:
    branches:
      - fix/credential-fallback-key-persistence

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/credential-fallback-key-persistence
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm
      - run: npm ci
      - name: Apply installed Prettier to the changed source file
        run: npx prettier --write src/components/SettingsPanel.tsx
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SettingsPanel.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes were necessary."
          else
            git commit -m "style: format settings panel"
            git push
          fi
