name: Resolve targeted minimatch overrides

on:
  push:
    branches:
      - security/minimatch-2026-118764

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/minimatch-2026-118764
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Report resolved minimatch versions
        run: node -e "const lock=require('./package-lock.json'); for(const [p,v] of Object.entries(lock.packages||{})) if(p.endsWith('node_modules/minimatch')) console.log(p,v.version)"
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh lockfile for patched minimatch"
            git push
          else
            echo "Lockfile already satisfies minimatch overrides."
          fi
