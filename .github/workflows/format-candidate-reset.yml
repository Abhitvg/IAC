name: Temporary Prettier formatting repair

on:
  push:
    branches: [fix/candidate-profile-clear-failure]
    paths:
      - '.github/workflows/format-candidate-reset.yml'
      - 'src/components/CandidateProfileWizard.tsx'
      - 'src/services/knowledgeVault/canonicalProfileService.ts'
      - 'src/services/knowledgeVault/knowledgeVaultService.ts'
      - 'src/store/useCandidateVaultStore.ts'
      - 'tests/canonicalProfileAndWizard.test.ts'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier configuration
        run: npx prettier --write src/components/CandidateProfileWizard.tsx src/services/knowledgeVault/canonicalProfileService.ts src/services/knowledgeVault/knowledgeVaultService.ts src/store/useCandidateVaultStore.ts tests/canonicalProfileAndWizard.test.ts
      - name: Commit formatter output when needed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/CandidateProfileWizard.tsx src/services/knowledgeVault/canonicalProfileService.ts src/services/knowledgeVault/knowledgeVaultService.ts src/store/useCandidateVaultStore.ts tests/canonicalProfileAndWizard.test.ts
            git commit -m "style: apply repository Prettier formatting"
            git push
          else
            echo "All targeted files already match Prettier."
          fi
