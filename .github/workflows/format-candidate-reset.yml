name: Format candidate reset patch

on:
  push:
    branches:
      - fix/candidate-profile-clear-failure

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/candidate-profile-clear-failure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Format candidate reset changes
        run: |
          npx prettier --write src/components/CandidateProfileWizard.tsx src/services/knowledgeVault/canonicalProfileService.ts src/services/knowledgeVault/knowledgeVaultService.ts src/store/useCandidateVaultStore.ts tests/canonicalProfileAndWizard.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src/components/CandidateProfileWizard.tsx src/services/knowledgeVault/canonicalProfileService.ts src/services/knowledgeVault/knowledgeVaultService.ts src/store/useCandidateVaultStore.ts tests/canonicalProfileAndWizard.test.ts
            git commit -m "style: format candidate profile reset changes"
            git push origin HEAD:fix/candidate-profile-clear-failure
          fi
