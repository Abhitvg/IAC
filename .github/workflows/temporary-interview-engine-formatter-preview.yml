name: Temporary Interview Engine Formatter Preview

on:
  push:
    branches:
      - ui/live-interview-minimal-chat-hud

jobs:
  formatter-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier changes
        run: npx prettier src/services/InterviewEngine.ts | diff -u src/services/InterviewEngine.ts - || true
