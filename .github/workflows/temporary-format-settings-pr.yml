name: Temporary format repair for settings persistence

on:
  push:
    branches: [main]
    paths:
      - 'src/store/useAppStore.ts'
      - 'src/utils/settingWriteQueue.ts'
      - 'tests/settingWriteQueue.test.ts'
      - '.github/workflows/temporary-format-settings-pr.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format settings source and tests
        run: npx prettier --write src/store/useAppStore.ts src/utils/settingWriteQueue.ts tests/settingWriteQueue.test.ts

      - name: Commit formatted files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/store/useAppStore.ts src/utils/settingWriteQueue.ts tests/settingWriteQueue.test.ts
          git commit -m "style: format settings persistence changes"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
