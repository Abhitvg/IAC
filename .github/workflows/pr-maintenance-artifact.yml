name: PR 232 maintenance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  maintenance:
    if: github.event.pull_request.number == 232 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Update Vite to patched 6.4.6 release
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev vite@6.4.6
      - name: Format PR maintenance files
        run: |
          npx prettier --write \
            docs/careerops-cognito-auth.md \
            packages/cloud-core/src/auth.ts \
            src/components/auth/CognitoAuthControl.tsx \
            src/screens/AppTopBar.tsx \
            src/services/auth/cognito.ts \
            src/services/cloudApi/client.ts \
            tests/cloud-api-client.test.ts \
            package.json package-lock.json
      - name: Verify formatting
        run: |
          npx prettier --check \
            docs/careerops-cognito-auth.md \
            packages/cloud-core/src/auth.ts \
            src/components/auth/CognitoAuthControl.tsx \
            src/screens/AppTopBar.tsx \
            src/services/auth/cognito.ts \
            src/services/cloudApi/client.ts \
            tests/cloud-api-client.test.ts \
            package.json package-lock.json
      - name: Commit formatted sources and Vite patch update
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/careerops-cognito-auth.md \
            packages/cloud-core/src/auth.ts \
            src/components/auth/CognitoAuthControl.tsx \
            src/screens/AppTopBar.tsx \
            src/services/auth/cognito.ts \
            src/services/cloudApi/client.ts \
            tests/cloud-api-client.test.ts \
            package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No maintenance changes to commit."
            exit 0
          fi
          git commit -m "fix(ci): format Cognito integration and patch Vite"
          git push origin "HEAD:$BRANCH_NAME"
      - name: Dispatch full CI against updated PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches \
            -d "{\"ref\":\"$BRANCH_NAME\"}"
